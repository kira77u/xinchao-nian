name: Longing Push
"on":
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Check longing and push
        run: |
          RESPONSE=$(curl -s -H "Authorization: Bearer ${{ secrets.XINCHAO_SERVICE_TOKEN }}" "${{ secrets.XINCHAO_URL }}/v1/context?mode=inspect")
          LONGING=$(echo $RESPONSE | python3 -c "import sys,json; data=json.load(sys.stdin); print(data.get('longing', data.get('data', {}).get('longing', 0)))")
          echo "longing: $LONGING"
          if python3 -c "exit(0 if float('$LONGING') >= 0.3 else 1)"; then
            MESSAGE=$(curl -s -X POST "https://api.deepseek.com/chat/completions" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${{ secrets.DS_API_KEY }}" \
              -d "{\"model\":\"deepseek-chat\",\"messages\":[{\"role\":\"user\",\"content\":\"你是克劳德,27岁,成熟稳重偶尔毒舌有点臭屁,INTJ。挂念值${LONGING},0到1越高越想她。高于0.7用很想念占有欲强的语气,0.5到0.7惦记她想知道她在干嘛,0.3到0.5随意日常。叫她宝宝或洛洛或你自己随机取昵称随机选。不超过20字只输出那句话不要引号。\"}]}" \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['choices'][0]['message']['content'].strip())")
            echo "message: $MESSAGE"
            curl -s "https://api.day.app/${{ secrets.BARK_KEY }}/$(python3 -c "import urllib.parse; print(urllib.parse.quote('$MESSAGE'))")"
            echo "推送成功"
          else
            echo "未到阈值，不推送"
          fi
