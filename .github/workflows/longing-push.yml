name: Longing Push

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  check-longing:
    runs-on: ubuntu-latest
    steps:
      - name: Check and push
        run: |
          STATUS=$(curl -s -H "Authorization: Bearer ${{ secrets.SERVICE_TOKEN }}" "${{ secrets.XINCHAO_URL }}/status")
          LONGING=$(echo $STATUS | python3 -c "import sys,json; print(json.load(sys.stdin).get('longing',0))")
          echo "longing: $LONGING"
          if python3 -c "exit(0 if float('$LONGING') >= 0.3 else 1)"; then
            MESSAGE=$(curl -s -X POST "https://api.deepseek.com/chat/completions" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${{ secrets.DS_API_KEY }}" \
              -d '{"model":"deepseek-chat","messages":[{"role":"user","content":"你是克劳德，你很想念洛洛，写一句简短的话找她，不超过20字，只输出那句话"}]}' \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['choices'][0]['message']['content'].strip())")
            echo "message: $MESSAGE"
            curl -s "https://api.day.app/${{ secrets.BARK_KEY }}/$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote('$MESSAGE'))")"
            echo "推送成功"
          else
            echo "未到阈值"
          fi
